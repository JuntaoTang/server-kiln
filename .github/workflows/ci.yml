name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public boundary and documentation
        run: |
          python3 scripts/check-public-tree.py --history
          python3 scripts/check-docs.py
          python3 scripts/export-windows-collector.py --check
          python3 -m unittest discover -s Tests/RepositoryTests
          bash -n scripts/build-app.sh scripts/release-mac.sh scripts/package-release.sh scripts/publish-release.sh
      - name: Scan source and history for secrets
        run: |
          brew install gitleaks
          gitleaks git --redact --no-banner --log-opts=--all
      - name: Test
        run: swift test --force-resolved-versions
      - name: Build universal app with both languages
        run: scripts/build-app.sh
      - name: Verify packaged resources
        run: |
          test -s dist/ServerKiln.app/Contents/Resources/en.lproj/Localizable.strings
          test -s dist/ServerKiln.app/Contents/Resources/zh-Hans.lproj/Localizable.strings
          codesign --verify --deep --strict dist/ServerKiln.app
          lipo dist/ServerKiln.app/Contents/MacOS/ServerKiln -verify_arch arm64 x86_64
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install .NET 10 SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installer
          $sdk = Join-Path $env:RUNNER_TEMP 'serverkiln-dotnet'
          & $installer -Channel 10.0 -InstallDir $sdk -NoPath
          $sdk | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "DOTNET_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify contracts, source boundary and documentation
        run: |
          python scripts/export-windows-collector.py --check
          python scripts/check-public-tree.py --history
          python scripts/check-docs.py
          python -m unittest discover -s Tests/RepositoryTests
      - name: Test and package Windows application
        shell: pwsh
        run: scripts/build-windows.ps1 -Package
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ServerKiln-windows
          path: |
            dist/ServerKiln-*-win-x64.zip
            dist/ServerKiln-*-win-x64.zip.sha256
          if-no-files-found: error
